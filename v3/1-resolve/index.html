<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aryan Mehta</title>
<style>
@font-face { font-family: "Newsreader"; src: url("../../fonts/Newsreader-Italic-wght.ttf") format("truetype"); font-style: italic; font-weight: 200 800; font-display: swap; }
@font-face { font-family: "Source Sans 3"; src: url("../../fonts/source-sans-3-latin-wght-normal.woff2") format("woff2"); font-weight: 200 900; font-display: swap; }

:root { --paper: #e9eaea; --ink: #141516; --soft: #5d6164; }
* { box-sizing: border-box; margin: 0; }
html, body { background: var(--paper); color: var(--ink); }
body { font-family: "Source Sans 3", sans-serif; -webkit-font-smoothing: antialiased; }

.track { height: 260vh; }
.stage { position: sticky; top: 0; height: 100dvh; min-height: 620px; overflow: hidden; }

canvas, .fallback { position: absolute; top: 0; right: 0; width: 62vw; height: 100%; display: block; }
.fallback { object-fit: cover; display: none; }
/* the picture has no edge: it dissolves into the paper on the reading side */
.stage::after { content: ""; position: absolute; top: 0; bottom: 0; left: 38vw; width: 22vw;
  background: linear-gradient(90deg, var(--paper), rgba(233,234,234,0)); pointer-events: none; }

.name { position: absolute; z-index: 2; top: 40px; left: 6vw; font-size: 17px; font-weight: 600; letter-spacing: 0.01em; }
.links { position: absolute; z-index: 2; top: 40px; right: 6vw; display: flex; gap: 28px; font-size: 16px; }
.links a { color: var(--ink); text-decoration: none; border-bottom: 1px solid transparent; padding-bottom: 2px; }
.links a:hover, .links a:focus-visible { border-bottom-color: var(--ink); }

.say { position: absolute; z-index: 2; left: 6vw; bottom: 12vh; width: min(46vw, 700px); }
.say h1 { font-family: "Newsreader", serif; font-style: italic; font-weight: 380; font-size: clamp(38px, 4.5vw, 70px);
  line-height: 1.1; letter-spacing: -0.015em; padding-bottom: 6px; }
.say p { margin-top: 28px; max-width: 40ch; font-size: 19px; line-height: 1.5; color: var(--soft); }
.say .a, .say .b { transition: opacity .5s ease; }
.say .b { position: absolute; left: 0; bottom: 0; opacity: 0; }

@media (max-width: 767px) {
  canvas, .fallback { width: 100vw; height: 62%; }
  .stage::after { display: none; }
  .say { left: 24px; right: 24px; width: auto; bottom: 40px; }
  .name { left: 24px; top: 24px; } .links { right: 24px; top: 24px; gap: 18px; }
}
</style>
</head>
<body>
<div class="track">
  <section class="stage">
    <div class="name">Aryan Mehta</div>
    <nav class="links"><a href="../../assets/Aryan-Mehta-Resume.pdf">Resume</a><a href="mailto:mehtaaryan1999@gmail.com">Email</a></nav>
    <canvas id="c" aria-hidden="true"></canvas>
    <img class="fallback" id="fb" src="../../assets/headshot.jpg" alt="Aryan Mehta">
    <div class="say">
      <div class="a">
        <h1>I turn a body&rsquo;s raw signal into something a caregiver can trust.</h1>
        <p>This is how a machine sees me. Keep scrolling and it becomes how you would.</p>
      </div>
      <div class="b">
        <h1>Hello. I&rsquo;m Aryan.</h1>
        <p>Engineer first, then researcher, then founding PM. Interim co-CEO of a health wearables company at 22.</p>
      </div>
    </div>
  </section>
</div>

<script type="module">
import { AsciiEngine } from "../../vendor/ascii/AsciiEngine.js";

const q = new URLSearchParams(location.search);
const shot = q.has("shot") ? parseFloat(q.get("shot") || "0.42") : null;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const canvas = document.getElementById("c");
const A = document.querySelector(".say .a"), B = document.querySelector(".say .b");

const engine = new AsciiEngine(canvas, {
  cellSize: +(q.get("cell")||7), exposure: +(q.get("exp")||1.7), attenuation: +(q.get("att")||1.0), threshold: 0.018, edgeThreshold: 12,
  sigma: 2.0, sigmaScale: 1.6, edges: true, fill: true, invert: true,
  asciiColor: [0.078, 0.082, 0.086], bgColor: [0.914, 0.918, 0.918],
});

if (!engine.supported) {
  canvas.style.display = "none"; document.getElementById("fb").style.display = "block";
} else {
  const img = new Image();
  img.onload = () => {
    // the engine reads video elements; a still rides in on a canvas that answers like one
    const c = document.createElement("canvas");
    c.width = img.naturalWidth; c.height = img.naturalHeight;
    c.getContext("2d").drawImage(img, 0, 0);
    c.videoWidth = c.width; c.videoHeight = c.height; c.readyState = 2; c.currentTime = 0;
    engine.setSource(c);
    run();
  };
  img.src = "../../assets/headshot.jpg";
}

function say(p) {
  const b = p > 0.8;
  A.style.opacity = b ? 0 : 1; B.style.opacity = b ? 1 : 0;
}

function run() {
  if (shot !== null || reduce) {
    const p = shot !== null ? shot : 1;
    engine.setProgress(p); engine.renderFrame(); say(p);
    requestAnimationFrame(() => engine.renderFrame());
    return;
  }
  const t0 = performance.now();
  const track = document.querySelector(".track");
  let last = -1;
  const tick = (now) => {
    // arrives as pure signal, settles a third of the way in, scroll does the rest
    const intro = Math.min(1, (now - t0) / 2600);
    const settle = 0.3 * (1 - Math.pow(1 - intro, 3));
    const span = track.offsetHeight - innerHeight;
    const s = Math.min(1, Math.max(0, scrollY / span));
    const p = Math.max(settle, Math.min(1, s * 1.15));
    if (Math.abs(p - last) > 0.0005) { engine.setProgress(p); engine._sourceDirty = true; engine.renderFrame(); say(p); last = p; }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
