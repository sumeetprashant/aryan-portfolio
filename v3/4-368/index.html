<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aryan Mehta</title>
<style>
@font-face { font-family: "Unbounded"; src: url("../../fonts/Unbounded-wght.ttf") format("truetype"); font-weight: 200 900; font-display: swap; }
@font-face { font-family: "Source Sans 3"; src: url("../../fonts/source-sans-3-latin-wght-normal.woff2") format("woff2"); font-weight: 200 900; font-display: swap; }

:root { --coal: #17181a; --bone: #e4e1d8; --ash: #8d8c87; --fall: #f0532b; }
* { box-sizing: border-box; margin: 0; }
html, body { background: var(--coal); color: var(--bone); }
body { font-family: "Source Sans 3", sans-serif; -webkit-font-smoothing: antialiased; }

.stage { min-height: 100dvh; display: flex; flex-direction: column; padding: 40px 6vw 9vh; max-width: 1600px; margin: 0 auto; }
header { display: flex; justify-content: space-between; font-size: 17px; }
header nav { display: flex; gap: 28px; }
a { color: var(--bone); text-decoration: none; border-bottom: 1px solid transparent; padding-bottom: 2px; }
a:hover, a:focus-visible { border-bottom-color: var(--bone); }

/* 368 marks, 46 to a row. Each one stands for a fall in the training set. */
.field { margin-top: 9vh; display: grid; grid-template-columns: repeat(46, 1fr); row-gap: clamp(14px, 2.4vh, 24px); }
.field i { display: block; justify-self: center; width: 2px; height: clamp(26px, 4.4vh, 42px); background: var(--bone); opacity: .5;
  border-radius: 1px; transform-origin: 50% 100%; transition: transform .5s cubic-bezier(.2,.8,.2,1); }
.field i.down { background: var(--fall); opacity: 1; width: 3px; }
.field i.saw { opacity: .95; }

.words { margin-top: auto; display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); column-gap: 6vw; align-items: end; }
h1 { font-family: "Unbounded", sans-serif; font-weight: 340; font-size: clamp(28px, 3.35vw, 54px); line-height: 1.12; letter-spacing: -0.035em; }
h1 em { font-style: normal; color: var(--fall); }
.words p { font-size: 19px; line-height: 1.5; color: var(--ash); max-width: 40ch; padding-bottom: 6px; }
.words p b { color: var(--bone); font-weight: 400; }

@media (max-width: 767px) {
  .stage { padding: 24px 24px 40px; }
  .field { grid-template-columns: repeat(23, 1fr); margin-top: 48px; row-gap: 10px; }
  .field i { height: 18px; }
  .words { grid-template-columns: 1fr; row-gap: 24px; margin-top: 48px; }
}
@media (prefers-reduced-motion: reduce) { .field i { transition: none; } }
</style>
</head>
<body>
<main class="stage">
  <header>
    <span>Aryan Mehta</span>
    <nav><a href="../../assets/Aryan-Mehta-Resume.pdf">Resume</a><a href="mailto:mehtaaryan1999@gmail.com">Email</a></nav>
  </header>
  <div class="field" id="f" role="img" aria-label="368 upright marks, one for each recorded fall. One of them has fallen over."></div>
  <div class="words">
    <h1>368 recorded falls. One watch that learned to <em>notice</em>.</h1>
    <p><b>I ran the program that recorded them,</b> tested 69 models against them, and put the winner on a watch built for senior care. That is one chapter. There are four more.</p>
  </div>
</main>

<script>
(() => {
  const f = document.getElementById("f"), N = 368, DOWN = 5 * 46 + 30;
  const shot = new URLSearchParams(location.search).has("shot");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const marks = [];
  for (let n = 0; n < N; n++) { const i = document.createElement("i"); f.appendChild(i); marks.push(i); }

  const rest = new Float32Array(N);              // where each mark wants to be when nobody is near
  function fall() {
    const d = marks[DOWN]; d.classList.add("down");
    rest[DOWN] = 90;
    // the two beside it turn toward it. That is the whole job.
    rest[DOWN - 1] = 13; rest[DOWN + 2] = -13;
    marks[DOWN - 1].classList.add("saw"); marks[DOWN + 2].classList.add("saw");
    if (!shot && !reduce) d.style.transition = "transform .9s cubic-bezier(.55,0,.9,.35)";
    apply();
    if (!shot && !reduce) setTimeout(() => { d.style.transition = ""; }, 1000);
  }
  function apply() { marks.forEach((m, n) => { m.style.transform = `rotate(${rest[n]}deg)`; }); }

  if (shot || reduce) fall(); else setTimeout(fall, 1400);

  // walking a cursor through the crowd: marks lean away from it, then stand back up
  if (!reduce && matchMedia("(pointer: fine)").matches) {
    let boxes = null, raf = 0, px = 0, py = 0;
    const measure = () => { boxes = marks.map(m => { const r = m.getBoundingClientRect(); return [r.left + r.width / 2, r.bottom]; }); };
    addEventListener("resize", () => { boxes = null; });
    f.addEventListener("pointermove", (e) => { px = e.clientX; py = e.clientY; if (!raf) raf = requestAnimationFrame(lean); });
    f.addEventListener("pointerleave", () => apply());
    function lean() {
      raf = 0; if (!boxes) { marks.forEach(m => m.style.transform = "rotate(0deg)"); measure(); }
      const R = 110;
      marks.forEach((m, n) => {
        if (n === DOWN) return;
        const dx = boxes[n][0] - px, dy = boxes[n][1] - 20 - py, d = Math.hypot(dx, dy);
        const push = d < R ? (1 - d / R) * 26 * Math.sign(dx || 1) : 0;
        m.style.transform = `rotate(${(rest[n] + push).toFixed(1)}deg)`;
      });
    }
  }
})();
</script>
</body>
</html>
